<!-- components/features/features.component.html -->
<section class="features-section">
  <h2 class="section-title">Why Choose Angular?</h2>
  <div class="features-grid">
    <mat-card *ngFor="let feature of features" class="feature-card">
      <mat-card-header>
        <div mat-card-avatar class="feature-icon">
          <mat-icon>{{feature.icon}}</mat-icon>
        </div>
        <mat-card-title>{{feature.title}}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{feature.description}}</p>
      </mat-card-content>
    </mat-card>
  </div>
</section>
