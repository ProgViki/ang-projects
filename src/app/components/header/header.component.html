<!-- components/header/header.component.html -->
<mat-toolbar color="primary">
  <div class="header-container">
    <a routerLink="/" class="logo">
      <img src="assets/images/angular-logo.svg" alt="Angular Logo" height="40">
      <span>Angular</span>
    </a>
    
    <div class="nav-links">
      <a mat-button routerLink="/" routerLinkActive="active">Home</a>
      <a mat-button routerLink="/about" routerLinkActive="active">About</a>
      <a mat-button routerLink="/learn" routerLinkActive="active">Learn</a>
      <a mat-button routerLink="/community" routerLinkActive="active">Community</a>
    </div>
    
    <button mat-icon-button class="menu-button" (click)="toggleMenu()">
      <mat-icon>menu</mat-icon>
    </button>
  </div>
</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav [(opened)]="isMenuOpen" position="end">
    <mat-nav-list>
      <a mat-list-item routerLink="/" (click)="isMenuOpen = false">Home</a>
      <a mat-list-item routerLink="/about" (click)="isMenuOpen = false">About</a>
      <a mat-list-item routerLink="/learn" (click)="isMenuOpen = false">Learn</a>
      <a mat-list-item routerLink="/community" (click)="isMenuOpen = false">Community</a>
    </mat-nav-list>
  </mat-sidenav>
</mat-sidenav-container>
